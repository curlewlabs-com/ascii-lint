[build-system]
requires = ["flit_core==4.2.0"]
build-backend = "flit_core.buildapi"

[project]
name = "ascii-lint"
version = "0.2.2"
description = "Report every non-ASCII character in a repository's tracked text, by codepoint and name."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Curlew Labs" }]
# The python3 the current Ubuntu hosted runner image ships; the package's
# __init__ refuses anything older with a message.
requires-python = ">=3.12"
# Nothing from PyPI: the package runs on the standard library, plus git on
# PATH, which lists the tracked files.
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
ascii-lint = "ascii_lint.cli:main"

[project.urls]
Repository = "https://github.com/curlewlabs-com/ascii-lint"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
